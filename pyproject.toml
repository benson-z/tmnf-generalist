[project]
name = "tmnf-collect"
version = "0.1.0"
description = "Scriptable TrackMania Nations Forever data collection for ML training"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.scripts]
tmnf-collect = "tmnf_collect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmnf_collect"]
