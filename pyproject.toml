[project]
name = "tmnf-collect"
version = "0.1.0"
description = "Scriptable TrackMania Nations Forever data collection for ML training"
requires-python = ">=3.11,<3.12"  # pygbx needs python-lzo, newest wheels are cp311
dependencies = [
    "numpy>=1.26",
    "pygbx>=0.3",
    "pillow>=10.0",
    "qoi>=0.7",          # lossless frame codec; see tmnf_collect.common.frames
    "zstandard>=0.22",   # packs the QOI stream, and releases the GIL
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.scripts]
tmnf-collect = "tmnf_collect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmnf_collect"]
