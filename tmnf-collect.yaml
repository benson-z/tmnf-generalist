# Defaults for tmnf-collect, picked up automatically from the working
# directory. Anything given on the command line still wins, so this sets the
# normal case rather than locking it in. `--config path.yaml` reads another.
#
# Every value here is measured rather than guessed; the notes say what by.

collect:
  # Eight instances at 2x passed 16/16 synchronized matrix runs across A07 and
  # C03, then 7/7 reproducible replays through the normal mixed-map scheduler.
  # That produced about 15.8x aggregate capture speed on the matrix runs.
  instances: 8

  # Chase camera, further back and higher than cam 2 (7.37 m vs 6.24 m behind,
  # 3.29 m vs 1.70 m above). Whatever is chosen has to be used at RL time too,
  # or the encoder meets a different-looking world when fine-tuning starts.
  camera: 1

  # 320x240 out of a 640x480 render: a clean 2:1 downscale, so every output
  # pixel averages exactly four rendered ones with nothing resampled across
  # block edges. Downscaling further to a training resolution stays available
  # later; throwing the detail away at capture time does not.
  width: 320
  height: 240

  # 20 Hz frames. Inputs are recorded at 100 Hz regardless, into inputs.jsonl,
  # because 74-84% of keyboard transitions fall between 20 Hz sample points.
  period: 50

  # Raise to 2 with up to 8 instances for the measured parallel barrier path
  # (31/31 exact concurrent runs, 15.8x aggregate with 8). Speeds 3-5 require
  # instances: 1. Leave at 1 for the closest camera match to human-speed play.
  speed: 2

  # The game HUD is not part of the world and would teach the model to read a
  # speedometer instead of the road.
  show_ui: false



  # MediaTracker clips are stripped from the staged copy of each map. Worth
  # about 20s a map, and some intros never end at all without a keypress, which
  # cannot be delivered to a background instance. This also removes the in-race
  # clips that hijack the camera mid-run.
  keep_intros: false

  # Lossless. QOI packed with zstd-6: 70.0KB a frame at 3669 frames a second
  # across eight encoder threads, against 66.9KB at 1054/s for lossless WebP
  # and 75.9KB at 835/s for PNG. Both halves release the GIL, which is what
  # keeps eight socket readers draining. See tmnf_collect.frames.
  # Costs about 5.8 GB per recorded hour against 0.85 GB for JPEG q80.
  frame_codec: qoi-zstd

harvest:
  # Only about half of harvested replays are keyboard, and roughly a tenth will
  # not reproduce, so over-harvest against the number of runs actually wanted.
  limit: 400
  min_awards: 5
  min_seconds: 25.0
  max_seconds: 75.0

  # Median of the credible leaderboard: author validation laps are frequently
  # far too slow to imitate, records are edge-of-control and near identical.
  prefer: median

  # Not racing. Well-awarded maps predate TMX's multi-tag support and carry
  # exactly one tag each, so excluding is unambiguous; what is left is the
  # natural mix of Race / FullSpeed / Tech / SpeedTech / Offroad and the rest.
  exclude_tags: LOL,PressForward,RPG,Trial,Maze,Stunt,Story

filter:
  # Keyboard is instant full lock, a pad emits continuous values; mixed, the
  # same corner carries contradictory labels.
  inputs: keyboard

  # Recording cost is linear in race time while the learning signal is roughly
  # per corner.
  max_seconds: 180.0
