# docker compose up -d --build
# Console: http://<host>:6080/vnc.html?autoconnect=1&resize=scale
services:
  tmnf:
    build: .
    image: tmnf-collect:latest
    container_name: tmnf
    init: true
    restart: unless-stopped
    user: "1000:1000"
    # host gids of /dev/dri/renderD128 (render) and /dev/dri/card0 (video)
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    devices:
      - /dev/dri:/dev/dri
    # SELinux hosts (Fedora) would deny the bind mounts and /dev/dri; no-op elsewhere.
    security_opt:
      - label=disable
    shm_size: 2g
    env_file:
      - .env
    ports:
      - "6080:6080"
    volumes:
      - ./data/home:/home/tmnf          # Wine prefix, venv, game user data
      - ./dl:/dl:ro                     # installers (not in git)
      - ..:/work                        # this repo
      - ${TMNF_OUT:-./data/out}:/out    # datasets
      - tmnf-ml:/tmnf-ml                # NAS: train_replays/, train_data/
    working_dir: /work

volumes:
  # tmnf-ml on the NAS: train_replays/ holds replay corpora, train_data/ the
  # collected datasets. Mounted by Docker itself so the host needs no
  # cifs-utils. Docker keeps these options with the volume once created: after
  # changing them, `docker compose down && docker volume rm docker_tmnf-ml`.
  tmnf-ml:
    driver: local
    driver_opts:
      type: cifs
      device: ${SMB_DEVICE}
      o: addr=${SMB_HOST},username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=1000,gid=1000
