# Settings for the Linux container (TMNF under Wine, Ryzen 5 5560U with the
# Vega iGPU, 6 cores / 12 threads). Selected by TMNF_CONFIG; the yaml beside
# the project holds the Windows numbers. Every value here was measured on this
# box with 20 harvested replays (834 s of runs).
collect:
  # Each instance lives in its own Wine desktop and is tiled on the console
  # output, so it can be watched. Not actually off screen; the instances just
  # must not overlap, because the compositor stops sending frames to a covered
  # window and the game stops rendering with them.
  offscreen: true

  # 8 lanes at 2x: 20/20 reproduced, every frame on its own tick, 141 s for
  # 834 s of runs (5.9x aggregate). 1x takes 182 s. 10 lanes drop frames,
  # 12 lanes drop many. The CPU is the limit.
  instances: 8
  processes: 8
  speed: 2

  camera: 1
  width: 320
  height: 240
  period: 50
  show_ui: false
  keep_intros: false
  # H.265 on the iGPU's video engine, QP 24 (CRF 18's size and quality): 20/20
  # ok in 137.0 s against 152.8 s for x265, which competes with the games for
  # CPU, and 138.8 s for lossless qoi-zstd. 7.2KB a frame, 33.5 dB RGB PSNR.
  frame_codec: hevc-vaapi

harvest:
  limit: 400
  min_awards: 5
  min_seconds: 25.0
  max_seconds: 75.0
  prefer: median
  exclude_tags: LOL,PressForward,RPG,Trial,Maze,Stunt,Story

filter:
  inputs: keyboard
  max_seconds: 180.0
