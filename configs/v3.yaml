# v3: v2 plus near-term waypoints (0.1, 0.2, 0.3 s) on the path head, so the
# shared features must encode the next few metres, not only 0.5-3 s ahead.
# Motivation: in v2 rollouts steering followed the 1 s waypoint on 99.7% of
# steps against 94% for the demos, i.e. it lost the short corrections. Own
# label index (work_v3), everything else as v2.
data:
  corpus: Z:/application_storage/tmnf-ml/train_data/corpus2
  work_dir: Z:/application_storage/tmnf-ml/work_v3
  waypoint_horizons_s: [0.1, 0.2, 0.3, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  downsample: 1
  window: 16
  frame_stride: 1
  source: video
  progress_horizon_s: 4.0

model:
  channels: [32, 64, 64]
  tokens_per_frame: 8
  width: 512
  layers: 8
  heads: 8

train:
  run_name: v3_near
  seed: 0
  epochs: 4
  batch_size: 32
  micro_batch: 8
  lr: 3.0e-4
  label_mode: soft
  # compile enabled from epoch 2 (resumed at the epoch-1 checkpoint): 1.63x
  # model throughput, gradients identical to the plain model. Do NOT combine
  # with channels_last: together they produced wrong gradients (cosine -0.006
  # vs the plain model on the same weights and batch); each alone is correct.
  compile: true
  channels_last: false
  w_policy: 1.0
  w_path: 0.5
  w_progress: 0.5
  eval_every_epochs: 1
  eval_mode: external       # evaluate with `tmnf-train eval-watch` alongside training

eval:
  # Small set: B01, one training-split map, one held-out map; 4 rollouts each.
  maps:
    - B01-Race
    - corpus:tmx-1016190   # training split
    - corpus:tmx-948303    # held out (val split)
    - tmx:10460245         # tmnf.exchange/trackshow/10460245 (not in the corpus)
  rollouts: 4
  temperature: 0.3
  timeout_s: 60             # race time per rollout
  rollout_max_wall_s: 120   # wall clock per rollout; ends as time_limit
  max_wall_s: 600           # wall clock for the whole eval; in-flight rollouts are cut
  stationary_s: 3.0
  lanes: 2
  speed: 2.0
  offscreen: false
  device: directml          # ONNX Runtime on the Radeon iGPU (adapter 1); keeps the training GPU free
  dml_device_id: 1
  keep_last_n_videos: null
