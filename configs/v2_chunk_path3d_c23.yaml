# E9 (v2_chunk_path3d: chunk head + height channel, 16 frames, 4 epochs) on
# corpus2 + corpus3 (2,469 more keyboard runs, 30 h, weighted to Tech,
# SpeedTech and Offroad). corpus23 is a directory of symlinks to both
# corpora's run dirs; the 4 runs collected in both are taken from corpus2.
# An epoch is about 2x E9's, so epoch 2 matches E9's step count and epoch 4
# E9L's (8 corpus2 epochs). Evaluate epochs 2, 3 and 4 in game: on corpus2
# extra epochs bought pace and lost reliability, and validation loss can't
# see that. Own index (work_path3d_c23).
data:
  corpus: $TMNF_STORAGE/train_data/corpus23
  work_dir: $TMNF_STORAGE/work_path3d_c23
  downsample: 1
  window: 16
  frame_stride: 1
  source: video
  progress_horizon_s: 4.0
  path_height: true
  action_chunk: 8

model:
  channels: [32, 64, 64]
  tokens_per_frame: 8
  width: 512
  layers: 8
  heads: 8

train:
  run_name: v2_chunk_path3d_c23
  compile: true
  ema_decay: 0.999
  seed: 0
  epochs: 4
  batch_size: 32
  micro_batch: 8
  lr: 3.0e-4
  label_mode: soft
  w_policy: 1.0
  w_path: 0.5
  w_progress: 0.5
  w_chunk: 0.5
  eval_every_epochs: 1
  eval_mode: external       # evaluate with `tmnf-train eval-watch` alongside training

eval:
  # Small set: B01, one training-split map, one held-out map; 4 rollouts each.
  maps:
    - B01-Race
    - corpus:tmx-1016190   # training split
    - corpus:tmx-948303    # held out (val split)
    - tmx:10460245         # tmnf.exchange/trackshow/10460245 (not in the corpus)
  rollouts: 4
  temperature: 0.5
  timeout_s: 60             # race time per rollout
  rollout_max_wall_s: 120   # wall clock per rollout; ends as time_limit
  max_wall_s: 600           # wall clock for the whole eval; in-flight rollouts are cut
  stationary_s: 3.0
  lanes: 2
  speed: 2.0
  offscreen: false
  device: directml          # ONNX Runtime on the Radeon iGPU (adapter 1); keeps the training GPU free
  dml_device_id: 1
  keep_last_n_videos: null
