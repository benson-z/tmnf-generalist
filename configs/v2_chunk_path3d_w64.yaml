# E9 (v2_chunk_path3d: chunk head + height channel, 4 epochs) with a 4x
# longer window: 64 frames (3.2 s) instead of 16 (0.8 s). The question is
# whether more history (yaw rate, how a slide developed, the last corner)
# helps the policy stay on the line. Everything else as E9; batch_size and
# micro_batch are cut 4x so each optimizer step still sees 512 frames and the
# step count, warmup and LR schedule match E9's. Same index (work_path3d).
data:
  corpus: Z:/application_storage/tmnf-ml/train_data/corpus2
  work_dir: Z:/application_storage/tmnf-ml/work_path3d
  downsample: 1
  window: 64
  frame_stride: 1
  source: video
  progress_horizon_s: 4.0
  path_height: true
  action_chunk: 8

model:
  channels: [32, 64, 64]
  tokens_per_frame: 8
  width: 512
  layers: 8
  heads: 8

train:
  run_name: v2_chunk_path3d_w64
  compile: true
  ema_decay: 0.999
  seed: 0
  epochs: 4
  batch_size: 8
  micro_batch: 2
  lr: 3.0e-4
  label_mode: soft
  w_policy: 1.0
  w_path: 0.5
  w_progress: 0.5
  w_chunk: 0.5
  eval_every_epochs: 1
  eval_mode: external       # evaluate with `tmnf-train eval-watch` alongside training

eval:
  maps:
    - B01-Race
    - corpus:tmx-1016190   # training split
    - corpus:tmx-948303    # held out (val split)
    - tmx:10460245         # tmnf.exchange/trackshow/10460245 (not in the corpus)
  rollouts: 4
  temperature: 0.5
  timeout_s: 60
  rollout_max_wall_s: 120
  max_wall_s: 600
  stationary_s: 3.0
  lanes: 2
  speed: 2.0
  offscreen: false
  device: directml
  dml_device_id: 1
  keep_last_n_videos: null
